[package]
name = "rust_mpc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust_mpc"
path = "src/main.rs"

[lib]
name = "rust_mpc"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.97"
futures = "0.3"
libp2p = { version = "0.54", features = ["tcp", "mdns", "noise", "yamux", "identify", "kad", "request-response", "tokio", "cbor", "macros"] }
rand = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
